[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brutus"
version = "0.2.0"
description = "Educational C2 framework — for authorized lab use only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests", "pynput", "opencv-python", "pyaudio", "pyautogui"]

[project.optional-dependencies]
dev = ["ruff", "pre-commit", "pytest"]

[project.scripts]
brutus = "brutus.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["brutus*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
